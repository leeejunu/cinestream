spring:
  config:
    # 로컬 비밀값은 api/.env.local에 둔다(gitignore). 형식은 .env.local.example 참고.
    import: optional:file:.env.local[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/threem_api
    username: threem
    password: threem
  security:
    oauth2:
      client:
        registration:
          google:
            # 실제 Google 로그인을 해 보려면 .env.local(또는 환경 변수)에 GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET을 넣는다.
            client-id: ${GOOGLE_CLIENT_ID:local-dummy}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-dummy}
  rabbitmq:
    host: localhost
    port: 5672
    username: threem
    password: threem
threem:
  auth:
    # 로컬 전용 서명 키. 운영에서는 JWT_SECRET 환경 변수로 넣는다.
    jwt-secret: local-only-jwt-secret-do-not-use-in-production
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    # Safari는 http://localhost에서 Secure 쿠키를 저장하지 않는다.
    cookie-secure: false
