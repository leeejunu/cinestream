server:
  port: 8080

spring:
  application:
    name: api
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            # SecurityConfig.OAUTH_CALLBACK_URI와 맞춘다. Google 콘솔에도 같은 주소를 등록한다.
            redirect-uri: "{baseUrl}/api/v1/auth/oauth/callback/{registrationId}"
            scope: openid, profile, email
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health

threem:
  auth:
    jwt-secret: ${JWT_SECRET:}
    access-token-ttl: 30m
    frontend-url: ${FRONTEND_URL:}
