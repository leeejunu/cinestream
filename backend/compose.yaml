# 로컬 개발용 인프라. 서비스마다 DB를 따로 둔다.
name: threem

services:
  postgres-api:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: threem
      POSTGRES_PASSWORD: threem
      POSTGRES_DB: threem_api
    ports:
      - "5433:5432"
    volumes:
      - postgres-api-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U threem -d threem_api"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # RabbitMQ는 호스트명으로 데이터 디렉터리를 구분하므로 고정한다.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: threem
      RABBITMQ_DEFAULT_PASS: threem
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # S3 호환 스토리지. 운영은 S3를 쓴다. 콘솔: http://localhost:9001
  minio:
    # 공식 minio/minio 이미지는 Docker Hub에서 받을 수 없어서 MinIO를 이어 빌드하는 pgsty/minio를 쓴다.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: threem
      MINIO_ROOT_PASSWORD: threem1234
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-api-data:
  rabbitmq-data:
  minio-data:
